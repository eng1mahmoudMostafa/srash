# render.yaml — النشر السحابي لـ«صراحة» على Render.com (Blueprint)
# =====================================================================
# الفكرة: تربط المستودع بـ Render مرة واحدة، وبعد كده
#   git push origin main  =  نشر تلقائي (بدون أي دخول للسيرفر!)
# =====================================================================
#
# الخطوات الكاملة:
#   1. أنشئ قاعدة بيانات مجانية على neon.tech (بدون بطاقة):
#        New Project → انسخ "Connection string" (يبدأ بـ postgres://)
#   2. GitHub → ارفع المستودع (لو لسه)
#   3. Render.com → New + → Blueprint → اختر المستودع
#   4. هيطلب منك القيم السرية (sync: false تحت) — ادخلها:
#        DJANGO_SECRET_KEY      : مفتاح عشوائي طويل
#        DATABASE_URL           : رابط Neon من الخطوة 1
#        MESSAGE_ENCRYPTION_KEY : نفس المفتاح الحالي في ~/srash/.env (مهم!
#                                 لو غيّرته الرسائل القديمة مش هتتقرأ)
#        IP_HMAC_KEY            : نفس المفتاح الحالي في ~/srash/.env
#        EMAIL_HOST_PASSWORD    : App Password بتاع Gmail (16 حرف)
#        R2_*                   : مفاتيح Cloudflare R2 (للصور)
#        VAPID_PUBLIC_KEY / VAPID_PRIVATE_KEY / VAPID_SUBJECT : للإشعارات
#   5. Apply → بيبني وينشر لوحده. خلاص.
#
# ملاحظات مهمة:
#   - الخطة المجانية: الموقع «ينام» بعد 15 دقيقة بدون زيارات،
#     أول زائر بعده يستنى ~30-60 ثانية. الحل: خطة مدفوعة 7$/شهر.
#   - البيانات كلها في Neon (مش على القرص) — النشر مابيمسحش حاجة.
#   - الصور في Cloudflare R2 — مابتاخدش مساحة من السيرفر.
#   - لو معاك دومين خاص: Render → Settings → Custom Domains (مجاني).

services:
  - type: web
    name: srash
    runtime: python
    plan: free
    region: frankfurt          # الأقرب لمصر/الشرق الأوسط
    healthCheckPath: /api/stats/
    buildCommand: >-
      cd backend &&
      pip install -r requirements.txt &&
      cd ../frontend &&
      npm install --no-audit --no-fund &&
      npm run build &&
      cd ../backend &&
      python manage.py collectstatic --noinput
    startCommand: >-
      cd backend &&
      python manage.py migrate --noinput &&
      gunicorn config.wsgi:application --bind 0.0.0.0:$PORT --workers 2 --timeout 60
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"

      # قاعدة البيانات — Neon Postgres مجاني (بدون بطاقة)
      - key: DB_ENGINE
        value: postgres
      - key: DATABASE_URL
        sync: false            # postgres://user:pass@host/db?sslmode=require

      # الخطة المجانية مفيهاش Redis — locmem كافي لنسخة واحدة
      - key: CACHE_BACKEND
        value: locmem

      # إعدادات الأمان (HTTPS على Render افتراضي)
      - key: COOKIE_SECURE
        value: "1"
      - key: SECURE_HSTS_SECONDS
        value: "31536000"
      - key: DJANGO_DEBUG
        value: "0"

      # البريد (القيم غير السرية)
      - key: EMAIL_BACKEND
        value: django.core.mail.backends.smtp.EmailBackend
      - key: EMAIL_HOST
        value: smtp.gmail.com
      - key: EMAIL_PORT
        value: "587"
      - key: EMAIL_USE_TLS
        value: "1"
      - key: EMAIL_HOST_USER
        value: sarahuhbilakadhb@gmail.com
      - key: DEFAULT_FROM_EMAIL
        value: sarahuhbilakadhb@gmail.com

      # رابط الموقع للرسايل (رابط إعادة التعيين)
      # سيبه فاضي أول مرة، وبعد أول نشر حط رابط onrender.com الحقيقي
      - key: SITE_BASE_URL
        value: ""

      # ---- القيم السرية (هيطلبها Render وقت الـ Apply) ----
      - key: DJANGO_SECRET_KEY
        sync: false
      - key: EMAIL_HOST_PASSWORD
        sync: false
      - key: MESSAGE_ENCRYPTION_KEY
        sync: false
      - key: IP_HMAC_KEY
        sync: false

      # صور Cloudflare R2 (مش هتاخد مساحة من السيرفر)
      - key: R2_ACCOUNT_ID
        sync: false
      - key: R2_BUCKET
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      - key: R2_PUBLIC_BASE
        sync: false

      # إشعارات الموبايل (Web Push)
      - key: VAPID_PUBLIC_KEY
        sync: false
      - key: VAPID_PRIVATE_KEY
        sync: false
      - key: VAPID_SUBJECT
        sync: false