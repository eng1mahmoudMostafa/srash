# render.yaml — النشر السحابي لـ«صراحة بلا كذب» على Render (Blueprint)
# الخطوات: GitHub → New repo → ارفع مجلد المشروع → Render → New + → Blueprint
# → اختر المستودع → أدخل القيم السرية المطلوبة → Apply. انتهى.
#
# القيم السرية الوحيدة المطلوب إدخالها وقت الـApply:
#   DJANGO_SECRET_KEY   (مفتاح عشوائي — مزوّد لك في التعليمات)
#   EMAIL_HOST_PASSWORD (كلمة مرور تطبيق Gmail ذات الـ16 حرفًا)
# كل شيء آخر (النطاق، CSRF، قاعدة البيانات) يُضبط تلقائيًا.

# لا قاعدة بيانات داخل Render (تطلب بطاقة) — نستخدم SQLite الآن،
# وللترقية لاحقًا: أنشئ Postgres مجاني على neon.tech ثم أضف في Render
# Environment:  DATABASE_URL=<رابط الاتصال>  و  DB_ENGINE=postgres
# وsettings.py يدعم DATABASE_URL جاهزًا.

services:
  - type: web
    name: srash
    runtime: python
    plan: free
    buildCommand: >-
      cd backend &&
      pip install -r requirements.txt &&
      cd ../frontend &&
      npm install --no-audit --no-fund &&
      npm run build &&
      cd ../backend &&
      python manage.py collectstatic --noinput
    startCommand: >-
      cd backend &&
      python manage.py migrate &&
      gunicorn config.wsgi:application --bind 0.0.0.0:$PORT --workers 2 --timeout 60
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
      # SQLite now (no card required). Later: set DB_ENGINE=postgres + DATABASE_URL.
      - key: DB_ENGINE
        value: sqlite
      # Free plan has no Redis — locmem cache works for a single instance.
      - key: CACHE_BACKEND
        value: locmem
      - key: COOKIE_SECURE
        value: "1"
      - key: SECURE_HSTS_SECONDS
        value: "31536000"
      # E-mail (non-secret parts)
      - key: EMAIL_BACKEND
        value: django.core.mail.backends.smtp.EmailBackend
      - key: EMAIL_HOST
        value: smtp.gmail.com
      - key: EMAIL_PORT
        value: "587"
      - key: EMAIL_USE_TLS
        value: "1"
      - key: EMAIL_HOST_USER
        value: sarahuhbilakadhb@gmail.com
      - key: DEFAULT_FROM_EMAIL
        value: sarahuhbilakadhb@gmail.com
      # Secrets — fill these during the Blueprint "Apply" step:
      - key: DJANGO_SECRET_KEY
        sync: false
      - key: EMAIL_HOST_PASSWORD
        sync: false