<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>صراحة بلا كذب — رسائل مجهولة</title>
    <script>
      // يطبّق الثيم المحفوظ قبل تحميل التطبيق حتى لا يومض لون الخلفية.
      (function () {
        try {
          document.documentElement.setAttribute(
            "data-theme",
            localStorage.getItem("srash-theme") || "light"
          );
        } catch (e) {
          document.documentElement.setAttribute("data-theme", "light");
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
